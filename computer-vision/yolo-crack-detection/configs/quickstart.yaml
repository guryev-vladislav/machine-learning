project:
  name: "yolo_crack_detection_quickstart"

paths:
  raw_videos: "data/raw"
  generated_videos: "data/videos"
  dataset_root: "data/quickstart_dataset"
  deepcrack: "../concrete_crack_detection/data/external/deepcrack"
  sdnet: "../concrete_crack_detection/data/external/sdnet2018"
  outputs: "outputs"
  pretrained_models: "src/models/pretrained"

video:
  fps: 10
  width: 640
  height: 480
  codec: "mp4v"

dataset:
  train_split: 0.8
  val_split: 0.2
  random_seed: 42
  class_names:
    - "no_crack"
    - "crack"

training:
  device: "cpu"
  epochs: 1
  batch_size: 2
  imgsz: 224
  learning_rate: 0.001
  patience: 1
  workers: 0
  task: "classify"
  model: "yolov8n-cls"

inference:
  confidence_threshold: 0.5
  iou_threshold: 0.5
  draw_confident: true
  output_video_fps: 20
